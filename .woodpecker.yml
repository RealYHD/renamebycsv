# .woodpecker.yml
pipeline:
  install:
    image: python
    commands:
      - pip install build
      - pip install pytest
      - pip install setuptools
      - pip install twine
  build:
    image: python
    commands:
    - python -m build
  publish:
    image: python
    commands:
    - pip -m twine upload --repository-url https://git.reslate.systems -u ${CI_NETRC_USERNAME} -p ${CI_NETRC_PASSWORD} --non-interactive --disable-progress-bar --verbose dist/*
  